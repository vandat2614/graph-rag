# Keep the same project name as the old infra folder, so existing volumes are reused
name: rag-graph

services:
  neo4j:
    image: neo4j:5-community
    container_name: graphrag-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt (used by the Python driver)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: graphrag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: graphrag-redis
    restart: unless-stopped
    # Localhost only: the api and worker reach it through the internal docker network
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  api:
    build: .
    container_name: graphrag-api
    restart: unless-stopped
    depends_on:
      - neo4j
      - qdrant
      - redis
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: .env
    environment:
      # Inside the compose network, services are reached by their service name
      NEO4J_URI: bolt://neo4j:7687
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # The embedding server (TEI) runs outside compose, on the VM host
      EMBEDDING_BASE_URL: http://host.docker.internal:8081/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data   # uploads and LLM cache, shared with the worker

  worker:
    build: .
    container_name: graphrag-worker
    restart: unless-stopped
    command: ["rq", "worker", "ingest", "--url", "redis://:${REDIS_PASSWORD}@redis:6379/0"]
    depends_on:
      - neo4j
      - qdrant
      - redis
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      EMBEDDING_BASE_URL: http://host.docker.internal:8081/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data

volumes:
  neo4j_data:
  qdrant_data:
  redis_data: